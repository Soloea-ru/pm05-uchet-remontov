services:
  mysql:
    image: mysql:8.0
    container_name: svyazservice-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: svyazservice
      MYSQL_USER: svyaz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-svyaz}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-svyazroot}
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - svyazservice_mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/migration_module3.sql:/docker-entrypoint-initdb.d/02-indexes.sql
      - ./sql/migration_admin_journal.sql:/docker-entrypoint-initdb.d/03-journal.sql

volumes:
  svyazservice_mysql:
